<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    放映室的標記：一塊亮起來的銀幕，被中線劈開。

    中線是這一站唯一不可協商的構圖 —— 開場把名字往兩側推、讓出中間那個口，
    舞台的影格再從同一條線拉開。整個網站就是這一條線在做事，所以標記就是它。

    只用三個元素：底、銀幕、中線。16px 的時候多一筆都會糊成一團。
  -->
  <rect width="32" height="32" fill="#0C0C0B"/>
  <rect x="4" y="9" width="24" height="14" fill="#E9E4D8"/>
  <rect x="15.25" y="9" width="1.5" height="14" fill="#FF4433"/>
</svg>
